name: Apply Pipeline Control Center v1.0.1

on:
  push:
    branches: [main]
    paths:
      - ".pcc-update/v1.0.1-delta.zip"
      - ".github/workflows/apply-v1.0.1.yml"

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply v1.0.1 delta
        shell: bash
        run: |
          set -euo pipefail
          unzip -o .pcc-update/v1.0.1-delta.zip -d .
          rm -rf .pcc-update
          rm -f .github/workflows/apply-v1.0.1.yml

      - name: Commit v1.0.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "release: v1.0.1 map and KML fixes"
          git push origin HEAD:main
