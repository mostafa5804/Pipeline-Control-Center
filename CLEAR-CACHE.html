<!doctype html><meta charset="utf-8"><title>PCC cache reset</title>
<body style="font-family:Arial,sans-serif;padding:24px"><h2>Pipeline Control Center cache reset</h2>
<p id="s">Clearing browser caches...</p>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();}
  if('caches' in window){for(const k of await caches.keys()) await caches.delete(k);}
  document.getElementById('s').textContent='Cache cleared. Close this tab and open 1.0.0.';
 }catch(e){document.getElementById('s').textContent='Done with warning: '+e.message;}
})();
</script></body>
